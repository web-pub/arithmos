<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arithmos — Mes résultats</title>
<link rel="icon" href="assets/logo-arithmos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="admin-header-left">
    <a class="home-icon" href="index.html" aria-label="Accueil du site" title="Accueil du site">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11L12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </a>
    <div class="admin-title-block">
      <div class="site-title">Arithmos</div>
      <span class="role-badge" id="role-badge">Résultats</span><span class="admin-version">V10-001</span>
    </div>
  </div>
  <div class="admin-user">
    <span id="user-email">…</span>
    <button id="logout-btn">Se déconnecter</button>
  </div>
</header>

<main class="admin-main">
  <section class="panel active" id="panel-resultats">
    <h2>Mes résultats</h2>
    <p class="panel-sub" id="resultats-sub">Indicateurs financiers des sociétés auxquelles tu as accès.</p>

    <div class="toolbar" id="resultats-toolbar" style="display:none;">
      <div class="field" style="min-width:260px;margin:0;">
        <label for="resultats-societe-select" style="display:block;font-size:13px;font-weight:600;margin-bottom:5px;">Société</label>
        <select id="resultats-societe-select"></select>
      </div>
      <div class="field" style="min-width:160px;margin:0;">
        <label for="resultats-exercice-select" style="display:block;font-size:13px;font-weight:600;margin-bottom:5px;">Exercice analysé</label>
        <select id="resultats-exercice-select"></select>
      </div>
      <div class="field" style="margin:0;align-self:flex-end;display:flex;gap:8px;">
        <button type="button" class="btn-outline" id="resultats-export-pdf">Export PDF</button>
        <button type="button" class="btn-outline" id="resultats-export-excel">Export Excel</button>
      </div>
    </div>

    <div id="resultats-content"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script type="module" src="assets/resultats.js"></script>
</body>
</html>
