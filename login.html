<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arithmos — Connexion Admin</title>
<link rel="icon" href="assets/logo-arithmos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{background:var(--navy-950);min-height:100vh;}
  .login-header{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;}
  .home-icon{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;
  }
  .home-icon:hover{border-color:#fff;}
  .login-shell{display:flex;align-items:center;justify-content:center;padding:40px 20px 80px;}
  .login-card{
    background:var(--paper);
    border-radius:6px;
    width:100%;max-width:400px;
    padding:40px 36px;
    box-shadow:0 30px 70px rgba(0,0,0,.4);
  }
  .login-card .brand{color:var(--ink);font-family:var(--font-display);font-size:22px;margin-bottom:4px;}
  .login-card .brand .brand-mark{color:var(--orange-500);}
  .login-card p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field input{
    width:100%;padding:11px 12px;border:1px solid var(--paper-line);border-radius:4px;
    font-family:var(--font-body);font-size:15px;background:#fff;
  }
  .field input:focus{outline:2px solid var(--orange-400);outline-offset:1px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:42px;}
  .pw-toggle{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;font-size:16px;color:var(--ink-soft);
    padding:6px;line-height:1;
  }
  .pw-toggle.is-visible{color:var(--orange-500);}
  .login-submit{
    width:100%;padding:12px;border:none;border-radius:4px;
    background:var(--orange-500);color:#fff;font-weight:600;font-size:15px;cursor:pointer;
  }
  .login-submit:hover{background:var(--orange-400);}
  .login-msg{font-size:13px;margin-top:14px;min-height:18px;}
  .login-msg.error{color:#c0392b;}
  .login-msg.ok{color:#1e7d43;}
  .login-foot{
    text-align:center;color:rgba(255,255,255,.4);font-size:12px;padding-bottom:24px;
  }
  .forgot-link{text-align:center;margin:14px 0 0;font-size:13px;}
  .forgot-link a{color:var(--ink-soft);text-decoration:underline;}
  .forgot-link a:hover{color:var(--orange-500);}
</style>
</head>
<body>

<div class="login-header">
  <a class="home-icon" href="index.html" aria-label="Accueil du site" title="Accueil du site">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11L12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
  </a>
  <span class="version-tag">V03-002</span>
</div>

<div class="login-shell">
  <div class="login-card">
    <div class="brand"><span class="brand-mark">A</span>rithmos</div>
    <p class="sub">Espace Admin — accès protégé</p>

    <form id="login-form">
      <div class="field">
        <label for="identifiant">Identifiant</label>
        <input type="text" id="identifiant" name="identifiant" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Afficher le mot de passe">👁</button>
        </div>
      </div>
      <button type="submit" class="login-submit">Se connecter</button>
      <p class="login-msg" id="login-msg"></p>
      <p class="forgot-link"><a href="mailto:helene.laruelle@gmail.com?subject=Arithmos%20-%20mot%20de%20passe%20oubli%C3%A9">Mot de passe oublié ? Demandez de l'aide à l'administrateur</a></p>
    </form>
  </div>
</div>

<p class="login-foot">© 2026 Hélène Laruelle — Arithmos</p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./assets/firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById('login-form');
  const msg = document.getElementById('login-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'login-msg';
    const identifiant = document.getElementById('identifiant').value.trim();
    const password = document.getElementById('password').value;

    try {
      // L'identifiant est résolu en e-mail réel via la table publique "identifiants"
      // avant d'authentifier — la personne ne tape jamais son adresse e-mail.
      const mapSnap = await getDoc(doc(db, 'identifiants', identifiant.toLowerCase()));
      if (!mapSnap.exists()) {
        msg.textContent = "Identifiant ou mot de passe incorrect.";
        msg.classList.add('error');
        return;
      }
      const email = mapSnap.data().email;
      await signInWithEmailAndPassword(auth, email, password);
      msg.textContent = 'Connexion réussie — redirection…';
      msg.classList.add('ok');
      window.location.href = 'admin.html';
    } catch (err) {
      msg.textContent = "Identifiant ou mot de passe incorrect.";
      msg.classList.add('error');
    }
  });
</script>
<script src="assets/app.js"></script>
</body>
</html>
